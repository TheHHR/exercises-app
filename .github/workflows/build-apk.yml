name: Build Android APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html styles.css app.js www/
          cp jsmediatags.min.js www/ || true

      - name: Initialize Capacitor Android
        run: |
          # 1. Add Android platform
          npx cap add android
          
          # 2. Add Permissions to AndroidManifest.xml
          # Standard Storage
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          # Media Playback & Foreground Services
          sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' android/app/src/main/AndroidManifest.xml
          # Android 13+ Notification Permission (Needed for progress bars)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # 3. Allow Cleartext (needed for some API/Media features)
          sed -i 's/android:fullBackupContent="@xml\/backup_rules"/android:fullBackupContent="@xml\/backup_rules" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # 4. Sync code to native project
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaHubPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
